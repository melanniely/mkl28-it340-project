<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Studio 11508 - Login</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <script src="transition.js"></script>
        <div class="split-container">
            <div class="left-panel">
                <h1>Welcome Back to Studio 11508</h1>
                <p>Step into the virtual space and listen to the portal opening</p>
            </div>
            <div class="right-panel">
                <div class="auth-card">
                    <div class="brand-header">
                        <h1>Sign In</h1>
                        <p>Access your portal studio experience</p>
                    </div>
                    <form action="index.html" method="GET">
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" required placeholder="name@example.com">
                        </div>
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" required placeholder="••••••••">
                        </div>
                        <button type="submit" class="btn-primary">Sign Up</button>
                    </form>
                    <div class="auth-links">
                        <p>Don't have an account? <a href="register.html">Sign up</a></p>
                        <p><a href="index.html">Continue as Guest</a></p>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
